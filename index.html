<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="" style="text-align: center">
      <button onclick="location.href = 'list_properti.html'">
        pindah halaman
      </button>
    </div>
    <div>
      <h1 class="h1">Ahay 1</h1>
      <h1 class="h2">Ahay 2</h1>
    </div>

    <div>
      <a
        href="https://github.com/MadisBinIsmad"
        style="
          font-weight: bold;
          margin-bottom: 20px;
          color: white;
          font-size: 20px;
        "
        >GitHub</a
      >
    </div>

    <div>
      <img
        src="Source/mybini.jpg"
        alt=""
        style="max-width: min-content; max-height: 500px; margin-top: 20px"
      />
    </div>

    <div>
      <table
        border="1"
        style="margin-top: 20px; color: white; margin-bottom: 20px"
      >
        <tr>
          <th>Nama</th>
          <th>Kelamin</th>
        </tr>
        <tr>
          <td>Dewa Iblis</td>
          <td>Secret</td>
        </tr>
      </table>
    </div>

    <section>
      <form action="">
        <div>
          <div class="justify-content">
            <label for="name">Name</label>
            <input type="text" placeholder="Enter your name" id="name" />
          </div>
          <div style="margin-top: 4px">
            <label for="email">Email</label>
            <input type="email" placeholder="Enter your email" id="email" />
          </div>
        </div>

        <div>
          <div style="margin-top: 12px; margin-bottom: 12px">
            <legend class="" style="color: aliceblue; font-size: medium">
              Keluhan
            </legend>
          </div>
          <div>
            <label for="ac_rusak">AC Rusak</label>
            <input type="radio" name="x" id="ac_rusak" value="ac_rusak" />
          </div>
          <div>
            <label for="pc_rusak">PC Rusak</label>
            <input type="radio" name="x" id="pc_rusak" value="pc_rusak" />
          </div>
        </div>

        <div class="justify-content-center" style="margin-top: 12px">
          <label for="keluhan">Keluhan</label>
          <textarea name="keluhan" id="keluhan"></textarea>
        </div>
      </form>
    </section>
    <div></div>
  </body>
</html>
